<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blobs one"></div>
        <div class="blobs two"></div>
        <div class="blobs three"></div>
        <div class="blobs four"></div>
        <div class="blobs five"></div>
    </div>
    <div class="card-login">
        <h2>Hello there,<br>Create Your Account</h2>
        <form action="">
            <input type="text" placeholder="Enter your Name" name="userName" id="userName">
            <input type="text" placeholder="Enter your Email Address" name="userEmail" id="userEmail">
            <input type="password" placeholder="Enter your Password" name="userPassword" id="userPassword">
             <input type="password" placeholder="Confirm Password" name="confirmPassword" id="confirmPassword">
            <p id="wrong"></p>
            <button type="submit" class="login-btn" id="signUpBtn">Sign up</button>
            <p class="continue-p">Or continue with</p>
            <div class="social-icon">
                <i class="fa-brands fa-facebook-f icon"></i>
                <i class="fa-brands fa-google icon"></i>
            </div>
            <p>you already have an account?<a href="index.html">Login</a></p>
        </form>
    </div>
    <script src="JS/signUp.js"></script>
</body>

</html>

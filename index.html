<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blobs one"></div>
        <div class="blobs two"></div>
        <div class="blobs three"></div>
        <div class="blobs four"></div>
        <div class="blobs five"></div>
    </div>
    <div class="card-login">
        <h2>Hello there,<br>Welcome Back</h2>
        <form action="">
            <input type="text" placeholder="Email Address" name="email" id="email">
            <input type="password" placeholder="Password" name="password" id="password">
            <a href="#" class="forgot-pass">Forgot Password?</a>
            <p id="message"></p>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
            <p class="continue-p">Or continue with</p>
            <div class="social-icon">
                <i class="fa-brands fa-facebook-f icon"></i>
                <i class="fa-brands fa-google icon"></i>
            </div>
            <p>Don't have an account?<a href='signUp.html'>Sign up</a></p>
        </form>
    </div>
    <script src="JS/login.js"></script>
</body>

</html>
